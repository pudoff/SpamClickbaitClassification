[project]
name = "spam-clickbait-classification"
version = "0.1.0"
description = "Сlassification API for spam and clickbait"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi (==0.142.2)", "uvicorn[standard] (==0.54.0)", "pydantic (==2.13.5)", "scikit-learn (==1.8.0)", "joblib (==1.6.0)", "numpy (>=1.24,<2.4)", "torch (==2.10.0)"]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
[tool.pytest.ini_options]
testpaths = ["inference-api/tests"]
pythonpath = ["inference-api"]

[tool.ruff]
target-version = "py312"
line-length = 120
force-exclude = true
extend-exclude = [
    ".venv",
    "Datasets/outputs",
    "Reviews",
    "ConceptAndArchitecture",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Пакеты inference-api; совпадает с inference-api/pyproject.toml.
known-first-party = ["app", "training", "tests"]

[dependency-groups]
training = [
    "pandas (==2.3.3)"
]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (==0.28.1)",
    "ruff (>=0.17.1,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
