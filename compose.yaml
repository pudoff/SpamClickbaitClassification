# Docker Compose проекта (03-final-architecture.md §11.1).
#
#   1) Экспортировать готовый ансамбль: см. inference-api/README.md
#   2) Поднять сервис:                                 docker compose up -d --build
#   3) Swagger UI:                                     http://localhost:8000/docs
#
# ASR работает в inference-api; Telegram-бот запускается профилем telegram.
name: spam-clickbait

x-inference-image: &inference-image
  build:
    context: .
    dockerfile: inference-api/Dockerfile
  image: spam-clickbait/inference-api:local

services:
  inference-api:
    <<: *inference-image
    environment:
      MODEL_PATH: /models/${MODEL_FILE:-ensemble/manifest.json}
      MODEL_META_PATH:
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS-2}
      TAU: ${TAU-0.55}
      TAU_SPAM: ${TAU_SPAM-0.65}
      ASR_ENABLED: ${ASR_ENABLED:-1}
    volumes:
      - ./inference-api/models:/models:ro
      - asr-cache:/home/appuser/.cache
    # Только 127.0.0.1: на сервере Swagger открывается через SSH-туннель (§11.1).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      start_period: 5m
    restart: unless-stopped

  bot:
    profiles: [telegram]
    build:
      context: .
      dockerfile: inference-api/Dockerfile
      target: bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      INFERENCE_API_URL: http://inference-api:8000
    depends_on:
      inference-api:
        condition: service_healthy
    restart: unless-stopped

  trainer:
    <<: *inference-image
    profiles: [train]
    command:
      - python
      - -m
      - training.train
      - --data=/data/df.csv
      - --out=/models
      - --config=${TRAIN_CONFIG:-exp4}
      - --version=${MODEL_VERSION:-1}
    volumes:
      - ./Datasets:/data:ro
      - ./inference-api/models:/models
    restart: "no"
    healthcheck:
      disable: true

volumes:
  asr-cache:
